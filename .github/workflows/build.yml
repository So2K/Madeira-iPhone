name: Build ONI split-store native canary
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
concurrency:
  group: oni-native-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      MADEIRA_PLANNED_SDK: f4d1acaa8ca6770ebfa7
      MADEIRA_RUNTIME_SDK: f4d1acaa8ca6770ebfa7
      MADEIRA_RUNTIME_REUSE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          filter: blob:none
          submodules: recursive
      - id: sdk
        run: bash tools/build/ci-input-key.sh
      - name: Validate exact native source and unchanged runtime recipes
        run: python3 tools/oxygen/native-only-ci.py check
      - name: Recover pinned public outputs from the successful full build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/oxygen/native-only-ci.py recover
      - id: pins
        run: |
          echo "wine=$(git rev-parse HEAD:wine)" >> "$GITHUB_OUTPUT"
          echo "dxmt=$(git rev-parse HEAD:dxmt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-deps-v2-${{ hashFiles('build/gnutls-ios/**', 'build/ffmpeg/build.sh', 'build/ffmpeg/src/**', 'build/freetype-ios/build.sh', 'tools/build/build-freetype-ios.sh', 'tools/build/setup-llvm-mingw.sh') }}
          path: |
            toolchains/llvm-mingw-*
            toolchains/gnutls-ios
            build/gnutls-ios/obj/*.done
            toolchains/ffmpeg-ios
            build/ffmpeg/obj
            build/freetype-ios/build
            research/freetype
      - id: cache-mingw
        uses: actions/cache/restore@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build/setup-llvm-mingw.sh') }}
          path: toolchains/llvm-mingw-*
      - id: cache-gnutls
        uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-gnutls-${{ hashFiles('build/gnutls-ios/build.sh', 'build/gnutls-ios/src/**', 'tools/build/sync-gnutls-libs.sh') }}
          path: |
            toolchains/gnutls-ios
            build/gnutls-ios/obj/*.done
      - id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-ffmpeg-${{ hashFiles('build/ffmpeg/build.sh', 'build/ffmpeg/src/**') }}
          path: |
            toolchains/ffmpeg-ios
            build/ffmpeg/obj
      - id: cache-freetype
        uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-freetype-${{ hashFiles('build/freetype-ios/build.sh', 'tools/build/build-freetype-ios.sh') }}
          path: |
            build/freetype-ios/build
            research/freetype
      - id: cache-rppairing
        uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.rust }}-rppairing-${{ hashFiles('build/rppairing-ios/**', '.cargo/**', 'rust-toolchain', 'rust-toolchain.toml') }}
          path: |
            app/Madeira/libmadeira_rppairing.a
            app/Madeira/legal/LICENSES-rppairing-crates.txt
      - uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-wine-host-${{ steps.pins.outputs.wine }}-${{ hashFiles('tools/build/build-wine.sh', 'tools/build/setup-llvm-mingw.sh') }}
          path: |
            wine/build-macos
            wine/build-arm64ec
      - uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.graphics }}-dxmt-ios-${{ steps.pins.outputs.dxmt }}-${{ steps.pins.outputs.wine }}-${{ hashFiles('build/dxmt-ios/build.sh', 'tools/build/build-dxmt-ios.sh', 'tools/build/build-shader-headers.sh', 'tools/build/build-llvm-ios.sh', 'build/madeira-d3d12/deps.sh', 'madeira-d3d12/src/**', 'madeira-d3d12/tests/native/**', 'madeira-d3d12/third_party/**', 'app/Madeira/d3d12/**') }}
          path: |
            app/Madeira/libdxmt_combined.a
            build/dxmt-ios/shader-headers
      - name: Fail closed before native compilation if any runtime input changed
        run: |
          python3 tools/build/runtime-components.py stage all
          python3 tools/build/runtime-components.py verify all
          python3 tools/oxygen/verify-ci-inputs.py
      - name: Build native unix libraries and complete app with verified reused runtimes
        run: tools/build-ipa.sh
      - name: Verify complete IPA and publish public provenance
        run: |
          python3 tools/oxygen/verify-ci-inputs.py --ipa dist/Madeira.ipa
          python3 tools/oxygen/native-only-ci.py final
      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-native-split-canary
          path: |
            dist/Madeira.ipa
            dist/native-only-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
