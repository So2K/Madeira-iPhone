name: Build isolated ONI UCRT canary
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: oni-ucrt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ucrt:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          filter: blob:none
      - name: Select pinned Xcode and SDK
        id: sdk
        run: |
          set -euo pipefail
          test "$(xcode-select -p)" = "$DEVELOPER_DIR"
          xcodebuild -version | head -n 1 | grep -Fx 'Xcode 27.1'
          bash tools/build/ci-input-key.sh
      - name: Fetch exact Wine source only
        run: git submodule update --init --depth 1 wine
      - name: Restore pinned MinGW
        uses: actions/cache/restore@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build/setup-llvm-mingw.sh') }}
          path: toolchains/llvm-mingw-*
      - name: Prepare pinned public compiler and Bison
        run: |
          set -euo pipefail
          brew install bison flex
          tools/build/setup-llvm-mingw.sh
      - name: Verify source and compiler before build
        run: |
          mkdir -p "$RUNNER_TEMP/ucrt-canary"
          python3 tools/oxygen/verify-ucrt-only.py source --pins tools/oxygen/ucrt-only-pins.json --repo-root "$GITHUB_WORKSPACE" --toolchain-root "$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal" --report "$RUNNER_TEMP/ucrt-canary/source-before.json"
      - name: Restore exact Wine host and ARM64EC build cache
        id: winecache
        uses: actions/cache/restore@v4
        with:
          key: plan19-${{ steps.sdk.outputs.key }}-wine-host-df1c5ea51e194937ac204bc3120922dc56a61bec-${{ hashFiles('tools/build/build-wine.sh', 'tools/build/setup-llvm-mingw.sh') }}
          path: |
            wine/build-macos
            wine/build-arm64ec
      - name: Build missing Wine host tools only
        if: steps.winecache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          tools/build/build-wine.sh
      - name: Download exact public reference artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' 'https://api.github.com/repos/So2K/Madeira-iPhone/actions/artifacts/12921902819/zip' --output "$RUNNER_TEMP/reference-runtime-windows.zip"
          python3 tools/oxygen/verify-ucrt-only.py reference --pins tools/oxygen/ucrt-only-pins.json --archive "$RUNNER_TEMP/reference-runtime-windows.zip" --report "$RUNNER_TEMP/ucrt-canary/reference.json"
      - name: Build only the fresh UCRT target with preserved delays
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix bison)/bin:$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          unset UNDELAY
          JOBS=4 DEST="$RUNNER_TEMP/ucrt-canary" bash build/wine-pe/build-modules.sh ucrtbase
          python3 tools/oxygen/verify-ucrt-only.py source --pins tools/oxygen/ucrt-only-pins.json --repo-root "$GITHUB_WORKSPACE" --toolchain-root "$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal" --report "$RUNNER_TEMP/ucrt-canary/source-after.json"
      - name: Gate fresh DLL ABI, imports, providers and hybrid delay stubs
        run: |
          python3 tools/oxygen/verify-ucrt-only.py candidate --pins tools/oxygen/ucrt-only-pins.json --archive "$RUNNER_TEMP/reference-runtime-windows.zip" --dll "$RUNNER_TEMP/ucrt-canary/ucrtbase.dll" --report "$RUNNER_TEMP/ucrt-canary/candidate.json"
          cp tools/oxygen/ucrt-only-pins.json "$RUNNER_TEMP/ucrt-canary/source-pins.json"
      - name: Publish the single DLL and public verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: oni-ucrt-preserved-delay
          path: ${{ runner.temp }}/ucrt-canary
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
